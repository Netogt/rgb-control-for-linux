[package]
name = "rgb-control"
version = "0.1.0"
description = "Interface para controlar o RGB dos dispositivos via SDK do OpenRGB"
authors = ["Luiz Neto"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "rgb_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
